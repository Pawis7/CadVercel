<!-- ======================================================
     CURSO CARD — componente global reutilizable
     Inspirado en la card de referencia: portada + metadata
     ====================================================== -->
<article
  class="grupo flex flex-col bg-white dark:bg-neutral-900 rounded-2xl border border-slate-200/80 dark:border-neutral-800 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 overflow-hidden h-full min-h-[440px]"
>
  <!-- ── Portada ───────────────────────────────────────── -->
  <div class="relative aspect-video overflow-hidden bg-slate-100 dark:bg-neutral-800">

    <!-- Imagen real (si existe) -->
    <img
      *ngIf="curso.portada"
      [src]="curso.portada"
      [alt]="curso.nombre"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
    />

    <!-- Placeholder cuando no hay portada -->
    <div
      *ngIf="!curso.portada"
      class="w-full h-full flex flex-col items-center justify-center gap-2 text-slate-400 dark:text-neutral-600 select-none"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
      </svg>
      <span class="text-xs font-medium">Sin portada</span>
    </div>

    <!-- Badge de nivel — esquina superior izquierda -->
    <span
      class="absolute top-3 left-3 inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider border backdrop-blur-sm"
      [ngClass]="nivelClasses"
    >
      {{ nivelLabel }}
    </span>

    <!-- Botón de menú — esquina superior derecha (para acciones futuras) -->
    <button
      class="absolute top-3 right-3 w-8 h-8 flex items-center justify-center bg-white/90 dark:bg-neutral-900/90 backdrop-blur-sm rounded-lg border border-slate-200/60 dark:border-neutral-700/60 text-slate-500 dark:text-neutral-400 hover:text-slate-800 dark:hover:text-white hover:bg-white dark:hover:bg-neutral-800 transition-all duration-150 shadow-xs"
      title="Opciones"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 5a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm0 7a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm0 7a1.5 1.5 0 110-3 1.5 1.5 0 010 3z"/>
      </svg>
    </button>
  </div>

  <!-- ── Cuerpo ─────────────────────────────────────────── -->
  <div class="p-5 flex flex-col flex-grow gap-3">

    <!-- Título -->
    <h3 class="text-base font-bold text-slate-900 dark:text-white leading-snug line-clamp-2 min-h-[2.75rem]">
      {{ curso.nombre }}
    </h3>

    <!-- Autor -->
    <p class="text-xs text-slate-500 dark:text-neutral-400 leading-none -mt-1">
      {{ autorNombre }}
    </p>

    <!-- ── Fila 1 de chips: nivel · duración · inscritos ── -->
    <div class="flex flex-wrap gap-1.5">

      <!-- Duración -->
      <span
        *ngIf="duracionLabel"
        class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full border text-[10px] font-semibold text-slate-600 dark:text-neutral-300 bg-slate-50 dark:bg-neutral-800/60 border-slate-200 dark:border-neutral-700"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        {{ duracionLabel }}
      </span>

      <!-- Módulos -->
      <span
        *ngIf="modulosCount > 0"
        class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full border text-[10px] font-semibold text-slate-600 dark:text-neutral-300 bg-slate-50 dark:bg-neutral-800/60 border-slate-200 dark:border-neutral-700"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
        </svg>
        {{ modulosCount }} {{ modulosCount === 1 ? 'módulo' : 'módulos' }}
      </span>

      <!-- Inscritos -->
      <span
        *ngIf="inscritosCount > 0"
        class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full border text-[10px] font-semibold text-slate-600 dark:text-neutral-300 bg-slate-50 dark:bg-neutral-800/60 border-slate-200 dark:border-neutral-700"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2h5m6 0a4 4 0 01-4-4h4a4 4 0 014 4z"/>
        </svg>
        {{ inscritosCount | number }} inscritos
      </span>
    </div>

    <!-- ── Fila 2 de etiquetas de la BD ─────────────────── -->
    <div *ngIf="curso.etiquetas.length > 0" class="flex flex-wrap gap-1.5">
      <span
        *ngFor="let tag of curso.etiquetas.slice(0, 3)"
        class="px-2.5 py-1 rounded-full text-[10px] font-semibold border text-slate-500 dark:text-neutral-400 bg-white dark:bg-neutral-900 border-slate-200 dark:border-neutral-800"
      >
        {{ tag }}
      </span>
      <span
        *ngIf="curso.etiquetas.length > 3"
        class="px-2.5 py-1 rounded-full text-[10px] font-semibold border text-slate-400 dark:text-neutral-500 bg-white dark:bg-neutral-900 border-slate-200 dark:border-neutral-800"
      >
        +{{ curso.etiquetas.length - 3 }}
      </span>
    </div>

    <!-- ── Footer: gratuito + CTA ───────────────────────── -->
    <div class="mt-auto pt-4 border-t border-slate-100 dark:border-neutral-800/60 flex items-center justify-end gap-3">

      <!-- Botón Ver Curso -->
      <a
        [routerLink]="['/cursos', curso.id]"
        class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg border-2 border-red-600 text-red-600 dark:border-red-600 dark:text-red-600 text-xs font-bold hover:bg-red-600 hover:text-white dark:hover:bg-red-600 dark:hover:text-white transition-colors duration-150"
      >
        Ver curso
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
        </svg>
      </a>
    </div>
  </div>
</article>
