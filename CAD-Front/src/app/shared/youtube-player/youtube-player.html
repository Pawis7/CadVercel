<div class="yt-frame group relative w-full overflow-hidden rounded-2xl bg-slate-900 shadow-lg ring-1 ring-slate-900/5">
  @if (!playing()) {
    <button
      type="button"
      (click)="play()"
      [attr.aria-label]="'Reproducir ' + displayTitle()"
      class="relative block w-full cursor-pointer focus:outline-none focus-visible:ring-4 focus-visible:ring-blue-400/60">
      @if (thumbnail()) {
        <img
          [src]="thumbnail()"
          [alt]="displayTitle()"
          loading="lazy"
          decoding="async"
          class="aspect-video w-full object-cover" />
      } @else {
        <div class="aspect-video w-full bg-gradient-to-br from-slate-800 to-slate-900"></div>
      }

      <div class="pointer-events-none absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-transparent"></div>

      <span
        class="pointer-events-none absolute inset-0 flex items-center justify-center">
        <span
          class="grid h-16 w-16 place-items-center rounded-full bg-white/95 shadow-2xl shadow-black/30 backdrop-blur transition-all duration-300 group-hover:bg-white sm:h-20 sm:w-20">
          <span translate="no" class="material-symbols-rounded translate-x-[2px] text-3xl text-blue-600 sm:text-4xl">play_arrow</span>
        </span>
      </span>

      <span class="pointer-events-none absolute inset-x-0 bottom-0 p-4 text-left sm:p-5">
        <span class="block text-sm font-bold text-white drop-shadow-md sm:text-base">{{ displayTitle() }}</span>
      </span>

      <span
        aria-hidden="true"
        class="pointer-events-none absolute inset-0 ring-1 ring-white/10"></span>
    </button>
  } @else if (embedUrl()) {
    <div class="aspect-video w-full">
      <iframe
        [src]="embedUrl()"
        [title]="displayTitle()"
        class="h-full w-full"
        loading="lazy"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen></iframe>
    </div>
  }
</div>
