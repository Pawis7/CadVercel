<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Cursos Alfa Digital · Portal público</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E9004C">
  <meta name="description" content="Portal público para aprender, convivir y participar en entornos digitales de forma segura y responsable.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/garet/Garet-Book.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/garet/Garet-Heavy.woff2" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,-25..0&display=swap" rel="stylesheet">
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('cad_theme');
        var supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && supportDarkMode)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="text-slate-800">
  <app-root></app-root>
</body>
</html>
