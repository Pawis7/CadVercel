<!DOCTYPE html>
<html>
<head>
  <title>Logo Cropper</title>
</head>
<body>
  <h1>Cropping logo... Check your downloads folder!</h1>
  <canvas id="canvas" style="display:none;"></canvas>
  <script>
    const img = new Image();
    img.src = '/assets/images/logo_aprende.png';
    img.onload = () => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      
      let minX = canvas.width;
      let minY = canvas.height;
      let maxX = 0;
      let maxY = 0;
      let foundPixels = false;
      
      for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
          const alpha = data[((y * canvas.width) + x) * 4 + 3];
          if (alpha > 0) {
            foundPixels = true;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      
      if (!foundPixels) {
        document.body.innerHTML += '<h2>No non-transparent pixels found!</h2>';
        return;
      }
      
      // Crop with a tiny margin of 4 pixels to avoid clipping edges
      const margin = 4;
      const cropX = Math.max(0, minX - margin);
      const cropY = Math.max(0, minY - margin);
      const cropW = Math.min(canvas.width - cropX, (maxX - minX) + 1 + (margin * 2));
      const cropH = Math.min(canvas.height - cropY, (maxY - minY) + 1 + (margin * 2));
      
      const cropCanvas = document.createElement('canvas');
      cropCanvas.width = cropW;
      cropCanvas.height = cropH;
      const cropCtx = cropCanvas.getContext('2d');
      cropCtx.drawImage(canvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
      
      const link = document.createElement('a');
      link.download = 'logo_aprende_cropped.png';
      link.href = cropCanvas.toDataURL('image/png');
      document.body.appendChild(link);
      link.click();
      document.body.innerHTML += '<h2>Done! File logo_aprende_cropped.png downloaded successfully!</h2>';
    };
  </script>
</body>
</html>
