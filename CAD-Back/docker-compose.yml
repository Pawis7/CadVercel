# =============================================================================
# DOCKER COMPOSE - CAD BACKEND (NESTJS + POSTGRESQL LOCAL)
# =============================================================================
# Uso:
#   docker compose up -d --build   → Construir y levantar DB + API
#   docker compose down -v         → Bajar y limpiar volúmenes
#   docker compose logs -f api     → Ver logs de la API en tiempo real
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # BASE DE DATOS - PostgreSQL 17
  # ---------------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    container_name: cad_db_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: cad
      POSTGRES_PASSWORD: cad_dev
      POSTGRES_DB: cad
    ports:
      - "5433:5432"
    volumes:
      - cad_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cad -d cad"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # API - NestJS
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: cad_api_local
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "5555:5555"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://cad:cad_dev@db:5432/cad?schema=public"
      NODE_ENV: development
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        echo '⏳ Aplicando migraciones de base de datos...' &&
        npx prisma migrate deploy &&
        echo '✅ Base de datos lista' &&
        echo '🚀 Iniciando API NestJS...' &&
        npm run start:dev
      "

volumes:
  cad_pgdata:
    name: cad_pgdata_local
