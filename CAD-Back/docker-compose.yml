# =============================================================================
# DOCKER COMPOSE - CAD BACKEND (ENTORNO LOCAL)
# =============================================================================
# USO:
#   docker compose up -d              → Levantar DB y API
#   docker compose --profile tools up → Levantar con pgAdmin
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # BASE DE DATOS POSTGRESQL 17
  # ---------------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    container_name: cad_db_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: cad
      POSTGRES_PASSWORD: cad_dev
      POSTGRES_DB: cad
    ports:
      - "5433:5432"
    volumes:
      - cad_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cad -d cad"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # API NEXT.JS
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cad_api_local
    restart: unless-stopped
    ports:
      - "4280:4280"
      - "5555:5555"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://cad:cad_dev@db:5432/cad?schema=public"
      NODE_ENV: development
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./public/uploads:/app/public/uploads
      - /app/.next # ← Volumen anónimo para evitar errores de permisos en cache
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        echo '⏳ Sincronizando base de datos...' &&
        npx prisma db push --accept-data-loss &&
        echo '✅ Base de datos sincronizada' &&
        echo '🌱 Ejecutando seeds...' &&
        npx prisma db seed || echo '⚠️ Seeds ya existentes o error (no crítico)' &&
        echo '🚀 Iniciando API...' &&
        npm run dev
      "

  # ---------------------------------------------------------------------------
  # PRISMA STUDIO (Interfaz visual para la DB)
  # ---------------------------------------------------------------------------
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cad_studio_local
    profiles: ["tools"] # Solo se levanta si lo pides explícitamente
    environment:
      - DATABASE_URL=postgresql://cad:cad_dev@db:5432/cad?schema=public
    ports:
      - "5555:5555"
    command: npx prisma studio --browser none
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # PGADMIN (OPCIONAL)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cad_pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cad.local
      PGADMIN_DEFAULT_PASSWORD: cad_dev
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  cad_pgdata:
    name: cad_pgdata_local
